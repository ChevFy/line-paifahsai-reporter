services:
  postgis:
    image: postgis/postgis:17-3.5
    platform: linux/amd64
    container_name: postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: gis
      POSTGRES_USER: gis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # keeps locale/collation predictable
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # optional: any .sql/.sh here runs on first init
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gis -d gis"]
      interval: 10s
      timeout: 5s
      retries: 5
    shm_size: 256mb

  seaweedfs:
    image: chrislusf/seaweedfs:4.00
    container_name: seaweedfs
    profiles: ["storage"]
    restart: unless-stopped
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        : "$${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}"
        : "$${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}"
        mkdir -p /etc/seaweedfs
        cat > /etc/seaweedfs/s3.json <<JSON
        {"identities": [{"name": "backend",
          "credentials": [{"accessKey": "$$S3_ACCESS_KEY", "secretKey": "$$S3_SECRET_KEY"}],
          "actions": ["Admin", "Read", "Write", "List", "Tagging"]}]}
        JSON
        exec /usr/bin/weed -logtostderr=true server -dir=/data -ip=seaweedfs -ip.bind=0.0.0.0 -volume.max=0 -master.volumeSizeLimitMB=256 -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - seaweeddata:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/healthz && wget -q -S -O /dev/null http://127.0.0.1:8333/ 2>&1 | grep -q 'HTTP/'"]
      interval: 10s
      timeout: 5s
      retries: 10

  seaweedfs-init:
    image: chrislusf/seaweedfs:4.00
    container_name: seaweedfs-init
    profiles: ["storage"]
    depends_on:
      seaweedfs:
        condition: service_healthy
    environment:
      S3_BUCKET: ${S3_BUCKET:-}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        : "$${S3_BUCKET:?set S3_BUCKET in .env}"
        echo "s3.bucket.create -name $$S3_BUCKET" | /usr/bin/weed shell -master=seaweedfs:9333
        echo "s3.bucket.list" | /usr/bin/weed shell -master=seaweedfs:9333 | grep -q "$$S3_BUCKET"
        echo "bucket ready: $$S3_BUCKET"
    restart: "no"

volumes:
  pgdata:
  seaweeddata:
