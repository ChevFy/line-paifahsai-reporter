[project]
name = "line-paifahsai-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "bcrypt>=5.0.0",
    "boto3>=1.43.109",
    "fastapi[standard]",
    "geoalchemy2>=0.20.0",
    "httpx>=0.28.1",
    "line-bot-sdk>=3.25.0",
    "psycopg[binary]>=3.3.6",
    "pyngrok>=8.1.2",
    "sqlalchemy[asyncio]>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
